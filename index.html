<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>気象庁API 天気予報アプリ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #444; }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .weather-box {
            margin-top: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        .weather-box:last-child { border-bottom: none; }
        .date { font-weight: bold; color: #555; margin-bottom: 5px; }
        .telop { font-size: 16px; font-weight: bold; color: #007bff; line-height: 1.4; }
        .comment { font-size: 13px; color: #777; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>気象庁 天気予報</h1>
        
        <!-- 地域を選択するプルダウン -->
        <select id="areaSelect" onchange="fetchWeather()">
            <option value="">-- 地域を選択してください --</option>
            <option value="016000">北海道（札幌）</option>
            <option value="040000">東北（仙台）</option>
            <option value="130000">関東（東京）</option>
            <option value="230000">中部（名古屋）</option>
            <option value="270000">近畿（大阪）</option>
            <option value="340000">中国（広島）</option>
            <option value="370000">四国（香川）</option>
            <option value="400000">九州（福岡）</option>
        </select>

        <!-- 予報結果を表示する場所 -->
        <div id="forecastResult"></div>
    </div>

    <script>
        async function fetchWeather() {
            const areaCode = document.getElementById("areaSelect").value;
            const resultDiv = document.getElementById("forecastResult");
            
            if (!areaCode) {
                resultDiv.innerHTML = "";
                return;
            }

            resultDiv.innerHTML = "<p>気象庁からデータを読み込み中...</p>";

            const url = `https://jma.go.jp{areaCode}.json`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('データが取得できませんでした');
                
                const data = await response.json();

                // 【最重要の修正：データ構造の「0番目」を完全に指定しました】
                const forecastData = data[0]; 
                const timeSeries = forecastData.timeSeries[0];
                const areaData = timeSeries.areas[0]; 
                
                const timeDefines = timeSeries.timeDefines; // 日付リスト
                const weathers = areaData.weathers;       // 天気テキスト
                const winds = areaData.winds;             // 風テキスト

                let htmlContent = "";

                // 今日・明日などの日数分ループして画面を作ります
                for (let i = 0; i < timeDefines.length; i++) {
                    const dateObj = new Date(timeDefines[i]);
                    const dateText = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日(${getJpDay(dateObj.getDay())})`;
                    
                    htmlContent += `
                        <div class="weather-box">
                            <div class="date">${dateText}</div>
                            <div class="telop">${weathers[i]}</div>
                            <div class="comment">💨 ${winds[i]}</div>
                        </div>
                    `;
                }

                resultDiv.innerHTML = htmlContent;

            } catch (error) {
                resultDiv.innerHTML = "<p style='color:red;'>気象庁データの取得に失敗しました。</p>";
                console.error("Error fetching weather:", error);
            }
        }

        function getJpDay(dayNum) {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            return days[dayNum];
        }
    </script>

</body>
</html>
