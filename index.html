<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気予報アプリ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #444; }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .weather-box {
            margin-top: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        .weather-box:last-child { border-bottom: none; }
        .date { font-weight: bold; color: #555; margin-bottom: 5px; }
        .telop { font-size: 20px; font-weight: bold; color: #007bff; margin: 5px 0; }
        .temp { font-size: 15px; color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>気象庁エリア選択 天気予報</h1>
        
        <!-- 調べていただいた気象庁のエリアコードをそのまま利用します -->
        <select id="areaSelect" onchange="fetchWeather()">
            <option value="">-- 地域を選択してください --</option>
            <option value="016000">北海道（札幌）</option>
            <option value="040000">東北（仙台）</option>
            <option value="130000">関東（東京）</option>
            <option value="230000">中部（名古屋）</option>
            <option value="270000">近畿（大阪）</option>
            <option value="340000">中国（広島）</option>
            <option value="370000">四国（香川）</option>
            <option value="400000">九州（福岡）</option>
        </select>

        <!-- 予報結果を表示する場所 -->
        <div id="forecastResult"></div>
    </div>

    <script>
        // エリアコードに応じた緯度・経度の自動マッピング
        const areaGeoMap = {
            "016000": { lat: 43.0621, lon: 141.3544, name: "北海道（札幌）" },
            "040000": { lat: 38.2682, lon: 140.8694, name: "東北（仙台）" },
            "130000": { lat: 35.6895, lon: 139.6917, name: "関東（東京）" },
            "230000": { lat: 35.1815, lon: 136.9066, name: "中部（名古屋）" },
            "270000": { lat: 34.6937, lon: 135.5023, name: "近畿（大阪）" },
            "340000": { lat: 34.3853, lon: 132.4553, name: "中国（広島）" },
            "370000": { lat: 34.3428, lon: 134.0466, name: "四国（香川）" },
            "400000": { lat: 33.6064, lon: 130.4182, name: "九州（福岡）" }
        };

        async function fetchWeather() {
            const areaCode = document.getElementById("areaSelect").value;
            const resultDiv = document.getElementById("forecastResult");
            
            if (!areaCode) {
                resultDiv.innerHTML = "";
                return;
            }

            resultDiv.innerHTML = "<p>データを安全に読み込み中...</p>";

            const geo = areaGeoMap[areaCode];
            
            // 【変更点】CORSによるセキュリティエラーを世界で最も起こしにくい公開データ通信を利用します
            const url = `https://open-meteo.com{geo.lat}&longitude=${geo.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                const daily = data.daily;
                const timeDefines = daily.time;
                const weatherCodes = daily.weather_code;
                const tempsMax = daily.temperature_2m_max;
                const tempsMin = daily.temperature_2m_min;

                let htmlContent = `<h3>${geo.name}の予報</h3>`;

                // 今日・明日・明後日の3日間のデータを組み立て
                for (let i = 0; i < 3; i++) {
                    const dateObj = new Date(timeDefines[i]);
                    const dateText = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日(${getJpDay(dateObj.getDay())})`;
                    
                    // 数字で返ってくる天気の暗号を、わかりやすい言葉と絵文字に変換
                    let weatherText = "くもり ☁️";
                    const code = weatherCodes[i];
                    if (code === 0) weatherText = "快晴 ☀️";
                    else if (code === 1 || code === 2 || code === 3) weatherText = "晴れ ⛅";
                    else if (code >= 45 && code <= 48) weatherText = "霧 🌫️";
                    else if (code >= 51 && code <= 67) weatherText = "雨 🌧️";
                    else if (code >= 71 && code <= 77) weatherText = "雪 ❄️";
                    else if (code >= 80 && code <= 82) weatherText = "にわか雨 🌦️";
                    else if (code >= 95 && code <= 99) weatherText = "雷雨 ⛈️";

                    htmlContent += `
                        <div class="weather-box">
                            <div class="date">${dateText}</div>
                            <div class="telop">${weatherText}</div>
                            <div class="temp">📈 最高: ${tempsMax[i]}°C / 📉 最低: ${tempsMin[i]}°C</div>
                        </div>
                    `;
                }

                resultDiv.innerHTML = htmlContent;

            } catch (error) {
                resultDiv.innerHTML = "<p style='color:red;'>データの読み込みに失敗しました。</p>";
                console.error("Error:", error);
            }
        }

        function getJpDay(dayNum) {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            return days[dayNum];
        }
    </script>

</body>
</html>
