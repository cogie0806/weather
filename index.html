                document.getElementById("areaSelect").value = savedArea;
                fetchWeather();
            }
        }

        function fetchWeather() {
            const areaCode = document.getElementById("areaSelect").value;
            const resultDiv = document.getElementById("forecastResult");
            
            if (!areaCode) {
                resultDiv.innerHTML = "";
                return;
            }

            localStorage.setItem('savedAreaCode', areaCode);

            const data = weatherDatabase[areaCode];
            let htmlContent = `<div class="result-title">🗺️ ${data.name} の予報</div>`;

                const f = data.forecasts[i];
                const dateText = getFutureDateText(i);
                
                let adviceText = "快適に過ごせる一日になりそうです。";
                if (f.w.includes("雨") || f.w.includes("☔") || f.w.includes("⛈️")) {
                    adviceText = "お出かけには傘を持っていこう！☔";
                } else if (f.w.includes("晴") || f.w.includes("☀️")) {
                    adviceText = "絶好の洗濯物干しチャンスです！☀️";
                } else if (f.w.includes("くもり") || f.w.includes("☁️")) {
                    adviceText = "折りたたみ傘があると安心です。☁️";
                }

                htmlContent += `
                    <div class="weather-box">
                        <div class="date">${dateText}</div>
                        <div class="telop">${f.w}</div>
                        <div class="temp-container">
                            <span class="max-temp">📈 最高: ${f.max}°C</span>
                            <span class="min-temp">📉 最低: ${f.min}°C</span>
                        </div>
                        <div class="detail-container">
                            <div class="detail-item">💧 湿度: ${f.rh}%</div>
                            <div class="detail-item">☔ 降水量: ${f.pr}mm</div>
                            <div class="detail-item">🧭 風向: ${f.wd}</div>
                            <div class="detail-item">💨 風速: ${f.ws}m/s</div>
                        </div>
                        <div class="advice-box">💡 ${adviceText}</div>
                    </div>
                `;
            }

            resultDiv.innerHTML = htmlContent;
        }
